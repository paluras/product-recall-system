services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/migrations/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: cmd/web/Dockerfile
    expose:
      - "54321"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
    command: ["./web",
              "-dbuser", "${DB_USER}",
              "-dbpass", "${DB_PASSWORD}",
              "-dbhost", "mysql",
              "-dbport", "3306",
              "-dbname", "${DB_NAME}"]
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME}
      - DB_PORT=3306
      - RESEND_API_KEY=${RESEND_API_KEY}
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
